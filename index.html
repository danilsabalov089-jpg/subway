<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Business Empire Tycoon</title>
  <script src="https://telegram.org"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Верхняя панель */
    .header {
      padding: 12px 16px 10px;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      z-index: 5;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .pill-btn {
      background: rgba(56, 189, 248, 0.18);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 7px 13px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .pill-btn:active { transform: scale(0.93); }
    .pill-btn.green {
      background: rgba(16, 185, 129, 0.22);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.45);
    }

    .rank-badge {
      display: inline-block;
      background: rgba(251, 191, 36, 0.16);
      border: 1px solid rgba(251, 191, 36, 0.35);
      color: #fbbf24;
      padding: 4px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
    }

    #balance {
      font-size: 36px;
      font-weight: 900;
      margin: 4px 0;
      color: #ffffff;
      text-shadow: 0 2px 12px rgba(56, 189, 248, 0.3);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-width: 340px;
      margin: 4px auto 0;
    }

    .stat-box {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 5px 8px;
      font-size: 11px;
      color: #94a3b8;
    }
    .stat-box b {
      display: block;
      font-size: 14px;
      color: #34d399;
      margin-top: 1px;
    }

    /* Центральная зона клика */
    .tap-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 8px;
    }

    #turbo-banner {
      position: absolute;
      top: 8px;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
      display: none;
    }

    .coin-wrapper {
      width: 186px;
      height: 186px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #coin-btn {
      width: 168px;
      height: 168px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #38bdf8, #0284c7 60%, #0f172a 100%);
      border: 5px solid #7dd3fc;
      box-shadow:
        0 12px 35px rgba(2, 132, 199, 0.55),
        inset 0 6px 14px rgba(255, 255, 255, 0.45),
        inset 0 -8px 16px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      cursor: pointer;
      transition: transform 0.05s ease;
    }

    #coin-btn:active, #coin-btn.pressed {
      transform: scale(0.91);
    }

    /* Полоска энергии */
    .energy-box {
      width: 86%;
      max-width: 340px;
      margin-top: 14px;
    }
    .energy-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    .energy-track {
      width: 100%;
      height: 12px;
      background: #0f172a;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    #energy-fill {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, #0ea5e9, #6366f1, #ec4899);
      transition: width 0.12s ease-out;
    }

    /* Нижняя панель магазина */
    .bottom-sheet {
      height: 46%;
      background: #131c31;
      border-top: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.45);
      z-index: 5;
    }

    .tabs {
      display: flex;
      padding: 6px 10px 0;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      flex: 1;
      padding: 11px 4px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }

    .cards-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-lvl {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
    }

    .card-desc {
      font-size: 12px;
      color: #34d399;
      margin-top: 2px;
    }

    .action-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      min-width: 90px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
    }
    .action-btn:active { transform: scale(0.93); }
    .action-btn.locked {
      background: #1e293b;
      color: #64748b;
      border: 1px solid #334155;
      box-shadow: none;
    }
    .action-btn.free {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    }

    /* Вылетающие цифры */
    .float-text {
      position: fixed;
      font-size: 24px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 50;
      animation: flyUp 0.75s ease-out forwards;
    }
    @keyframes flyUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.85); }
      100% { opacity: 0; transform: translate(-50%, -95px) scale(1.15); }
    }

    /* Модальное окно */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 22px;
      max-width: 320px;
      width: 100%;
      text-align: center;
    }
    .modal-icon { font-size: 48px; margin-bottom: 8px; }
    .modal-title { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
    .modal-text { font-size: 14px; color: #cbd5e1; margin-bottom: 16px; line-height: 1.4; }
    .modal-btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="top-actions">
      <button class="pill-btn" onclick="inviteFriend()">👥 Друзья</button>
      <div class="rank-badge" id="rank">Ур. 1 • Новичок</div>
      <button class="pill-btn green" onclick="saveToBot()">💾 В бот</button>
    </div>
    <div id="balance">$0</div>
    <div class="stats-grid">
      <div class="stat-box">Доход за клик<b id="per-tap">+$1</b></div>
      <div class="stat-box">Пассивный доход<b id="per-sec">+$0/сек</b></div>
    </div>
  </div>

  <div class="tap-area">
    <div id="turbo-banner">🔥 ТУРБО x2 (<span id="turbo-sec">20</span>с)</div>
    <div class="coin-wrapper">
      <div id="coin-btn">💎</div>
    </div>
    <div class="energy-box">
      <div class="energy-header">
        <span>⚡ Энергия</span>
        <span id="energy-label">500 / 500</span>
      </div>
      <div class="energy-track">
        <div id="energy-fill"></div>
      </div>
    </div>
  </div>

  <div class="bottom-sheet">
    <div class="tabs">
      <div class="tab-btn active" id="tab-biz" onclick="selectTab('biz')">🏢 Бизнесы</div>
      <div class="tab-btn" id="tab-tap" onclick="selectTab('tap')">⚡ Прокачка</div>
