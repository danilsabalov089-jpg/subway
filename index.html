<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Гимнастика на турнике</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      overflow: hidden;
      background: linear-gradient(180deg, #3a8ee6 0%, #87cefa 65%, #d4f1f9 100%);
      font-family: Arial, sans-serif;
    }
    canvas { display: block; width: 100vw; height: 100vh; }

    /* Верхний счётчик перехватов */
    #top-hud {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.75); border-radius: 6px;
      padding: 4px 14px; font-size: 20px; font-weight: bold; color: #222;
      z-index: 10; pointer-events: none; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* Левая панель кнопок */
    .left-panel {
      position: absolute; top: 0; left: 0; width: 24%; height: 100%;
      display: flex; flex-direction: column; z-index: 10;
    }
    /* Правая панель кнопок */
    .right-panel {
      position: absolute; top: 0; right: 0; width: 24%; height: 100%;
      display: flex; flex-direction: column; z-index: 10;
    }

    .ctrl-btn {
      flex: 1; background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.55);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: bold; color: #111;
      text-align: center; padding: 5px; touch-action: manipulation;
    }
    .ctrl-btn:active, .ctrl-btn.active {
      background: rgba(255, 255, 255, 0.65);
    }

    /* Нижняя панель (Меню + Замедление) */
    .bottom-bar {
      position: absolute; bottom: 0; left: 24%; right: 24%; height: 42px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      z-index: 10;
    }
    #btn-slow {
      background: rgba(255, 255, 255, 0.75); border: 1px solid #999;
      padding: 6px 14px; border-radius: 4px; font-size: 14px; font-weight: bold;
    }
    #btn-slow.active { background: #ffd700; }
    #btn-save {
      background: rgba(46, 139, 87, 0.9); color: #fff; border: none;
      padding: 6px 12px; border-radius: 4px; font-size: 13px; font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="top-hud"><span id="score">0</span> перехватов</div>

  <div class="left-panel">
    <div class="ctrl-btn" id="btn-release">Отпустить</div>
    <div class="ctrl-btn active" id="btn-stick">Прилипание</div>
    <div class="ctrl-btn" id="btn-reset" style="flex: 0.5;">Сброс</div>
  </div>

  <div class="right-panel">
    <div class="ctrl-btn" id="btn-arch">Прогиб</div>
    <div class="ctrl-btn" id="btn-tuck">Группировка</div>
    <div class="ctrl-btn active" id="btn-straight">Прямое тело</div>
  </div>

  <div class="bottom-bar">
    <button id="btn-slow">Замедление</button>
    <button id="btn-save">💾 В бот</button>
  </div>

  <canvas id="game"></canvas>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Состояние игры
    let score = 0;
    let autoStick = true;
    let slowMo = false;
    let pose = 'straight'; // 'arch' (Прогиб), 'tuck' (Группировка), 'straight' (Прямое тело)

    // Турники (перекладины)
    const bars = [];
    function initBars() {
      bars.length = 0;
      const startX = canvas.width * 0.35;
      const startY = canvas.height * 0.38;
      bars.push({ x: startX, y: startY, id: 0 });
      for (let i = 1; i < 40; i++) {
        bars.push({
          x: startX + i * 260 + (Math.random() - 0.5) * 60,
          y: canvas.height * (0.25 + Math.random() * 0.35),
          id: i
        });
      }
    }

    // Гимнаст
    const gymnast = {
      attachedBar: null,
      angle: Math.PI / 2, // Вниз головой или висит
      angVel: 0,
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      bodyAngle: 0,
      spinVel: 0,
      lastBarId: 0
    };

    function resetGame() {
      initBars();
      score = 0;
      document.getElementById('score').innerText = score;
      gymnast.attachedBar = bars;
      gymnast.angle = 0.2;
      gymnast.angVel = 0.06;
      gymnast.x = bars.x;
      gymnast.y = bars.y;
      gymnast.lastBarId = 0;
      setPose('straight');
    }

    // Управление позами
    function setPose(newPose) {
      pose = newPose;
      document.getElementById('btn-arch').classList.toggle('active', pose === 'arch');
      document.getElementById('btn-tuck').classList.toggle('active', pose === 'tuck');
      document.getElementById('btn-straight').classList.toggle('active', pose === 'straight');
    }

    // Привязка кнопок
    const bindTouch = (id, fn) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); fn(); });
    };

    bindTouch('btn-release', () => {
      if (gymnast.attachedBar) {
        const L = getArmBodyLength();
        // Линейная скорость при отрыве от турника
        const tangentialSpeed = gymnast.angVel * L;
        gymnast.vx = Math.cos(gymnast.angle) * tangentialSpeed * 1.15;
        gymnast.vy = -Math.sin(gymnast.angle) * tangentialSpeed * 1.15;
        gymnast.bodyAngle = gymnast.angle;
        gymnast.spinVel = gymnast.angVel;
        gymnast.attachedBar = null;
      }
    });

    bindTouch('btn-stick', () => {
      autoStick = !autoStick;
      document.getElementById('btn-stick').classList.toggle('active', autoStick);
    });

    bindTouch('btn-reset', resetGame);
    bindTouch('btn-arch', () => setPose('arch'));
    bindTouch('btn-tuck', () => setPose('tuck'));
    bindTouch('btn-straight', () => setPose('straight'));

    bindTouch('btn-slow', () => {
      slowMo = !slowMo;
      document.getElementById('btn-slow').classList.toggle('active', slowMo);
    });

    document.getElementById('btn-save').addEventListener('click', () => {
      tg.sendData(JSON.stringify({ action: 'save_gym', score: score }));
    });

    function getArmBodyLength() {
      if (pose === 'tuck') return 48; // В группировке радиус меньше — крутится быстрее
      if (pose === 'arch') return 72;
      return 68;
    }

    // Физика
    function update() {
      const dt = slowMo ? 0.35 : 1.0;

      if (gymnast.attachedBar) {
        const bar = gymnast.attachedBar;
        // Гравитация маятника + раскачка от смены позы (прогиб/группировка)
        const gravity = 0.0038;
        let pump = 0;
        if (pose === 'arch') pump = 0.0018 * Math.cos(gymnast.angle);
        if (pose === 'tuck') pump = -0.0015 * Math.sin(gymnast.angle);

        gymnast.angVel += (-gravity * Math.sin(gymnast.angle) + pump) * dt;
        gymnast.angVel *= 0.996; // Минимальное трение
        gymnast.angle += gymnast.angVel * dt;

        gymnast.x = bar.x;
        gymnast.y = bar.y;
      } else {
        // Полет в воздухе
        gymnast.vy += 0.24 * dt; // Сила тяжести
        gymnast.x += gymnast.vx * dt;
        gymnast.y += gymnast.vy * dt;

        // В группировке сальто крутится в 2.2 раза быстрее
        const spinMult = pose === 'tuck' ? 2.2 : (pose === 'arch' ? 0.85 : 1.0);
        gymnast.bodyAngle += gymnast.spinVel * spinMult * dt;

        // Проверка захвата следующего турника
        if (autoStick) {
          for (let bar of bars) {
            if (bar.id !== gymnast.lastBarId) {
              const dist = Math.hypot(gymnast.x - bar.x, gymnast.y - bar.y);
              if (dist < 32) {
                gymnast.attachedBar = bar;
                gymnast.lastBarId = bar.id;
                gymnast.angle = Math.atan2(gymnast.x - bar.x, gymnast.y - bar.y);
                gymnast.angVel = (gymnast.vx * Math.cos(gymnast.angle) - gymnast.vy * Math.sin(gymnast.angle)) / getArmBodyLength();
                score++;
                document.getElementById('score').innerText = score;
                break;
              }
            }
          }
        }

        // Если упал слишком низко — сброс
        if (gymnast.y > canvas.height + 200) {
          resetGame();
        }
      }
    }

    // Отрисовка
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Камера следит за гимнастом
      const camX = gymnast.x - canvas.width * 0.45;
      const camY = (gymnast.y - canvas.height * 0.45) * 0.4;

      ctx.save();
      ctx.translate(-camX, -camY);

      // Красные конструкции зала на фоне (как на скриншоте)
      ctx.fillStyle = '#c84b31';
      for (let gx = -200; gx < 12000; gx += 320) {
        ctx.fillRect(gx, -300, 14, 1200);
        ctx.fillRect(gx, 140, 320, 12);
        ctx.fillRect(gx, 360, 320, 12);
      }

      // Перекладины (турники)
      bars.forEach(bar => {
        // Стойка
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(bar.x - 45, bar.y - 6, 45, 12);
        // Сама перекладина
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(bar.x, bar.y);
        ctx.lineTo(bar.x + 28, bar.y + 14);
        ctx.stroke();

        // Точка захвата
        ctx.fillStyle = bar === gymnast.attachedBar ? '#ffd700' : '#ffffff';
        ctx.beginPath();
        ctx.arc(bar.x, bar.y, 6, 0, Math.PI * 2);
        ctx.fill();
      });

      // Отрисовка гимнаста (серая модель с суставами как на скриншоте)
      ctx.save();
      ctx.translate(gymnast.x, gymnast.y);
      const drawAngle = gymnast.attachedBar ? -gymnast.angle : -gymnast.bodyAngle;
      ctx.rotate(drawAngle);

      ctx.strokeStyle = '#666';
      ctx.fillStyle = '#777';
      ctx.lineCap = 'round';
