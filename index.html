<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Business Empire Tycoon</title>
  <script src="https://telegram.org"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at top, #1e293b 0%, #090d16 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Верхняя панель */
    .header {
      padding: 12px 16px 10px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      position: relative;
      z-index: 5;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .pill-btn {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }
    .pill-btn:active { transform: scale(0.94); }
    .pill-btn.green {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }

    .rank-badge {
      display: inline-block;
      background: linear-gradient(90deg, rgba(251, 191, 36, 0.15), rgba(245, 158, 11, 0.15));
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fbbf24;
      padding: 3px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 700;
    }

    #balance {
      font-size: 36px;
      font-weight: 900;
      margin: 4px 0;
      background: linear-gradient(180deg, #ffffff 20%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      max-width: 340px;
      margin: 4px auto 0;
    }

    .stat-box {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 5px 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    .stat-box b {
      display: block;
      font-size: 14px;
      color: #34d399;
      margin-top: 1px;
    }

    /* Центральная зона клика */
    .tap-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 10px;
    }

    #turbo-banner {
      position: absolute;
      top: 10px;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.5);
      display: none;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.06); }
    }

    .coin-wrapper {
      position: relative;
      width: 196px;
      height: 196px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #coin-btn {
      width: 174px;
      height: 174px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #38bdf8, #0284c7 60%, #0f172a 100%);
      border: 5px solid #7dd3fc;
      box-shadow:
        0 12px 35px rgba(2, 132, 199, 0.55),
        inset 0 6px 14px rgba(255, 255, 255, 0.45),
        inset 0 -8px 16px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 74px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.05s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    #coin-btn.pressed {
      transform: scale(0.91);
      box-shadow:
        0 4px 15px rgba(2, 132, 199, 0.4),
        inset 0 4px 10px rgba(0, 0, 0, 0.5);
    }

    /* Полоска энергии */
    .energy-box {
      width: 86%;
      max-width: 340px;
      margin-top: 16px;
    }
    .energy-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 5px;
    }
    .energy-track {
      width: 100%;
      height: 12px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    #energy-fill {
      width: 100%;
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, #0ea5e9, #6366f1, #ec4899);
      transition: width 0.12s ease-out;
    }

    /* Нижняя панель магазина */
    .bottom-sheet {
      height: 45%;
      background: #131c31;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 22px 22px 0 0;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.4);
      z-index: 5;
    }

    .tabs {
      display: flex;
      padding: 6px 10px 0;
      gap: 6px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .tab-btn {
      flex: 1;
      padding: 10px 4px;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: #64748b;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      touch-action: manipulation;
    }
    .tab-btn.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
    }

    .cards-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .card {
      background: rgba(30, 41, 59, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .card-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-lvl {
      font-size: 11px;
      color: #38bdf8;
      font-weight: 600;
    }

    .card-desc {
      font-size: 12px;
      color: #34d399;
      margin-top: 2px;
    }

    .action-btn {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      min-width: 88px;
      text-align: center;
      cursor: pointer;
      touch-action: manipulation;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      flex-shrink: 0;
    }
    .action-btn:active { transform: scale(0.93); }
    .action-btn.locked {
      background: #1e293b;
      color: #64748b;
      border: 1px solid #334155;
      box-shadow: none;
    }
    .action-btn.free {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.35);
    }

    /* Вылетающие цифры */
    .float-text {
      position: fixed;
      font-size: 24px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      z-index: 50;
      animation: flyUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes flyUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.8); }
      40% { opacity: 1; transform: translate(-50%, -45px) scale(1.15); }
      100% { opacity: 0; transform: translate(-50%, -95px) scale(1); }
    }

    /* Модальное окно оффлайн-дохода и уведомлений */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-box {
      background: #1e293b;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 20px;
      padding: 22px;
      max-width: 320px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .modal-icon { font-size: 48px; margin-bottom: 8px; }
    .modal-title { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
    .modal-text { font-size: 14px; color: #cbd5e1; margin-bottom: 16px; line-height: 1.4; }
    .modal-btn {
      width: 100%;
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="top-actions">
      <button class="pill-btn" id="btn-invite">👥 Друзья</button>
      <div class="rank-badge" id="rank">Ур. 1 • Новичок</div>
      <button class="pill-btn green" id="btn-save">💾 В бот</button>
    </div>
    <div id="balance">$0</div>
