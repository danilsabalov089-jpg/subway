<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Гимнастика на турнике</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body {
      overflow: hidden;
      background: linear-gradient(180deg, #3a8ee6 0%, #87cefa 65%, #d4f1f9 100%);
      font-family: Arial, sans-serif;
    }
    canvas { display: block; width: 100vw; height: 100vh; }

    #top-hud {
      position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.8); border-radius: 6px;
      padding: 4px 12px; font-size: 16px; font-weight: bold; color: #222;
      z-index: 10; pointer-events: none; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      white-space: nowrap;
    }

    .left-panel {
      position: absolute; top: 0; left: 0; width: 21%; height: 100%;
      display: flex; flex-direction: column; z-index: 10;
    }
    .right-panel {
      position: absolute; top: 0; right: 0; width: 21%; height: 100%;
      display: flex; flex-direction: column; z-index: 10;
    }

    .ctrl-btn {
      flex: 1; background: rgba(255, 255, 255, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.55);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold; color: #111;
      text-align: center; padding: 2px; touch-action: manipulation;
      word-break: break-word;
    }
    .ctrl-btn:active, .ctrl-btn.active {
      background: rgba(255, 255, 255, 0.65);
    }

    .bottom-bar {
      position: absolute; bottom: 8px; left: 22%; right: 22%; height: 38px;
      display: flex; align-items: center; justify-content: center; gap: 6px;
      z-index: 10;
    }
    #btn-slow {
      background: rgba(255, 255, 255, 0.85); border: 1px solid #999;
      padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold;
    }
    #btn-slow.active { background: #ffd700; }
    #btn-save {
      background: rgba(46, 139, 87, 0.9); color: #fff; border: none;
      padding: 6px 10px; border-radius: 4px; font-size: 12px; font-weight: bold;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="top-hud"><span id="score">0</span> перехватов</div>

  <div class="left-panel">
    <div class="ctrl-btn" id="btn-release">Отпустить</div>
    <div class="ctrl-btn active" id="btn-stick">Прилипание</div>
    <div class="ctrl-btn" id="btn-reset" style="flex: 0.45;">Сброс</div>
  </div>

  <div class="right-panel">
    <div class="ctrl-btn" id="btn-arch">Прогиб</div>
    <div class="ctrl-btn" id="btn-tuck">Группировка</div>
    <div class="ctrl-btn active" id="btn-straight">Прямое тело</div>
  </div>

  <div class="bottom-bar">
    <button id="btn-slow">Замедление</button>
    <button id="btn-save">💾 В бот</button>
  </div>

  <canvas id="game"></canvas>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let score = 0;
    let autoStick = true;
    let slowMo = false;
    let pose = 'straight';

    const bars = [];
    function initBars() {
      bars.length = 0;
      const startX = canvas.width * 0.45;
      const startY = canvas.height * 0.38;
      bars.push({ x: startX, y: startY, id: 0 });
      for (let i = 1; i < 60; i++) {
        bars.push({
          x: startX + i * 210 + (Math.random() - 0.5) * 40,
          y: canvas.height * (0.28 + Math.random() * 0.25),
          id: i
        });
      }
    }

    const gymnast = {
      attachedBar: null,
      angle: 0.2,
      angVel: 0,
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      bodyAngle: 0,
      spinVel: 0,
      lastBarId: 0
    };

    function resetGame() {
      initBars();
      score = 0;
      document.getElementById('score').innerText = score;
      gymnast.attachedBar = bars[0];
      gymnast.angle = 0.35;
      gymnast.angVel = 0.05;
      gymnast.x = bars[0].x;
      gymnast.y = bars[0].y;
      gymnast.lastBarId = 0;
      setPose('straight');
    }

    function setPose(newPose) {
      pose = newPose;
      document.getElementById('btn-arch').classList.toggle('active', pose === 'arch');
      document.getElementById('btn-tuck').classList.toggle('active', pose === 'tuck');
      document.getElementById('btn-straight').classList.toggle('active', pose === 'straight');
    }

    const bindTouch = (id, fn) => {
      const el = document.getElementById(id);
      el.addEventListener('touchstart', (e) => { e.preventDefault(); fn(); });
      el.addEventListener('mousedown', (e) => { e.preventDefault(); fn(); });
    };

    bindTouch('btn-release', () => {
      if (gymnast.attachedBar) {
        const L = getArmBodyLength();
        const tangentialSpeed = gymnast.angVel * L;
        gymnast.vx = Math.cos(gymnast.angle) * tangentialSpeed * 1.15;
        gymnast.vy = -Math.sin(gymnast.angle) * tangentialSpeed * 1.15;
        gymnast.bodyAngle = gymnast.angle;
        gymnast.spinVel = gymnast.angVel;
        gymnast.attachedBar = null;
      }
    });

    bindTouch('btn-stick', () => {
      autoStick = !autoStick;
      document.getElementById('btn-stick').classList.toggle('active', autoStick);
    });

    bindTouch('btn-reset', resetGame);
    bindTouch('btn-arch', () => setPose('arch'));
    bindTouch('btn-tuck', () => setPose('tuck'));
    bindTouch('btn-straight', () => setPose('straight'));

    bindTouch('btn-slow', () => {
      slowMo = !slowMo;
      document.getElementById('btn-slow').classList.toggle('active', slowMo);
    });

    document.getElementById('btn-save').addEventListener('click', () => {
      tg.sendData(JSON.stringify({ action: 'save_gym', score: score }));
    });

    function getArmBodyLength() {
      if (pose === 'tuck') return 46;
      if (pose === 'arch') return 68;
      return 64;
    }

    function update() {
      const dt = slowMo ? 0.35 : 1.0;

      if (gymnast.attachedBar) {
        const bar = gymnast.attachedBar;
        const gravity = 0.0042;
        let pump = 0;
        if (pose === 'arch') pump = 0.0022 * Math.cos(gymnast.angle);
        if (pose === 'tuck') pump = -0.0018 * Math.sin(gymnast.angle);

        gymnast.angVel += (-gravity * Math.sin(gymnast.angle) + pump) * dt;
        gymnast.angVel *= 0.996;
        gymnast.angle += gymnast.angVel * dt;

        gymnast.x = bar.x;
        gymnast.y = bar.y;
      } else {
        gymnast.vy += 0.24 * dt;
        gymnast.x += gymnast.vx * dt;
        gymnast.y += gymnast.vy * dt;

        const spinMult = pose === 'tuck' ? 2.2 : (pose === 'arch' ? 0.85 : 1.0);
        gymnast.bodyAngle += gymnast.spinVel * spinMult * dt;

        if (autoStick) {
          for (let bar of bars) {
            if (bar.id !== gymnast.lastBarId) {
              const dist = Math.hypot(gymnast.x - bar.x, gymnast.y - bar.y);
              if (dist < 36) {
                gymnast.attachedBar = bar;
                gymnast.lastBarId = bar.id;
                gymnast.angle = Math.atan2(gymnast.x - bar.x, gymnast.y - bar.y);
                gymnast.angVel = (gymnast.vx * Math.cos(gymnast.angle) - gymnast.vy * Math.sin(gymnast.angle)) / getArmBodyLength();
                score++;
                document.getElementById('score').innerText = score;
                break;
              }
            }
          }
        }

        if (gymnast.y > canvas.height + 220) {
          resetGame();
        }
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const camX = gymnast.x - canvas.width * 0.45;
      const camY = (gymnast.y - canvas.height * 0.42) * 0.4;

      ctx.save();
      ctx.translate(-camX, -camY);

      // Красные конструкции зала на фоне
      ctx.fillStyle = '#c84b31';
      for (let gx = -200; gx < 15000; gx += 260) {
        ctx.fillRect(gx, -300, 12, 1400);
        ctx.fillRect(gx, canvas.height * 0.22, 260, 10);
        ctx.fillRect(gx, canvas.height * 0.55, 260, 10);
      }

      // Перекладины (турники)
      bars.forEach(bar => {
        ctx.fillStyle = '#e0e0e0';
        ctx.fillRect(bar.x - 36, bar.y - 5, 36, 10);
        ctx.strokeStyle = '#999';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(bar.x, bar.y);
        ctx.lineTo(bar.x + 24, bar.y + 12);
        ctx.stroke();

        ctx.fillStyle = bar === gymnast.attachedBar ? '#ffd700' : '#ffffff';
        ctx.beginPath();
        ctx.arc(bar.x, bar.y, 6, 0, Math.PI * 2);
        ctx.fill();
      });

      // Отрисовка гимнаста
      ctx.save();
      ctx.translate(gymnast.x, gymnast.y);
      const drawAngle = gymnast.attachedBar ? -gymnast.angle : -gymnast.bodyAngle;
      ctx.rotate(drawAngle);

      ctx.strokeStyle = '#555';
      ctx.fillStyle = '#666';
      ctx.lineCap = 'round';

      if (pose === 'tuck') {
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.lineTo(10, 22);
        ctx.stroke();

        ctx.lineWidth = 11;
        ctx.beginPath();
        ctx.arc(14, 34, 14, 0, Math.PI * 1.5);
        ctx.stroke();

        ctx.beginPath(); ctx.arc(4, 24, 8, 0, Math.PI * 2); ctx.fill();
      } else if (pose === 'arch') {
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-4, 28); ctx.stroke();
        ctx.lineWidth = 11;
        ctx.beginPath(); ctx.moveTo(-4, 28); ctx.quadraticCurveTo(12, 48, 2, 68); ctx.stroke();
        ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(2, 68); ctx.lineTo(-10, 96); ctx.stroke();
        ctx.beginPath(); ctx.arc(6, 26, 8, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.lineWidth = 8;
