<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Business Empire Tycoon</title>
  <script src="https://telegram.org"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1120;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* Шапка */
    .header {
      padding: 10px 14px;
      background: #111827;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
      flex-shrink: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .top-btn {
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .top-btn.save {
      background: #064e3b;
      color: #34d399;
      border-color: #059669;
    }

    .rank-pill {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.35);
      color: #fbbf24;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
    }

    #balance {
      font-size: 38px;
      font-weight: 900;
      color: #ffffff;
      line-height: 1.1;
      margin: 4px 0;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
    }
    .stat-chip {
      background: #1e293b;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 12px;
      color: #94a3b8;
    }
    .stat-chip b { color: #34d399; }

    /* Центральная зона клика */
    .center-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      min-height: 210px;
    }

    #turbo-tag {
      position: absolute;
      top: 6px;
      background: linear-gradient(90deg, #f59e0b, #ef4444);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 14px;
      display: none;
    }

    #coin-btn {
      width: 164px;
      height: 164px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #38bdf8, #0284c7 65%, #0f172a 100%);
      border: 5px solid #7dd3fc;
      box-shadow: 0 10px 30px rgba(2, 132, 199, 0.5), inset 0 6px 12px rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 72px;
      cursor: pointer;
      transition: transform 0.05s ease;
    }
    #coin-btn.active { transform: scale(0.9); }

    .energy-wrap {
      width: 84%;
      max-width: 320px;
      margin-top: 12px;
    }
    .energy-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin-bottom: 4px;
    }
    .energy-bar {
      width: 100%;
      height: 11px;
      background: #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    #energy-fill {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
    }

    /* Нижняя панель магазина */
    .shop {
      height: 46%;
      background: #111827;
      border-top: 2px solid #1e293b;
      border-radius: 20px 20px 0 0;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #1e293b;
    }
    .tab {
      flex: 1;
      padding: 12px 4px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
      color: #64748b;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }
    .tab.active {
      color: #38bdf8;
      border-bottom-color: #38bdf8;
      background: rgba(56, 189, 248, 0.05);
    }

    .list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 24px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      -webkit-overflow-scrolling: touch;
    }

    /* Вся карточка кликабельна */
    .item-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
    }
    .item-card:active {
      transform: scale(0.98);
      background: #263349;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .item-icon {
      width: 42px;
      height: 42px;
      background: #0f172a;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }
    .item-name {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
    }
    .item-meta {
      font-size: 12px;
      color: #34d399;
      margin-top: 2px;
    }
    .item-lvl {
      color: #38bdf8;
      font-weight: 700;
    }

    .price-badge {
      background: #2563eb;
      color: #ffffff;
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      min-width: 84px;
      text-align: center;
      pointer-events: none;
    }
    .price-badge.locked {
      background: #0f172a;
      color: #64748b;
      border: 1px solid #334155;
    }
    .price-badge.free {
      background: #059669;
    }

    /* Вылетающие цифры */
    .pop-num {
      position: fixed;
      font-size: 24px;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
      pointer-events: none;
      z-index: 999;
      animation: popUp 0.7s ease-out forwards;
    }
    @keyframes popUp {
      0% { opacity: 1; transform: translate(-50%, 0) scale(0.9); }
      100% { opacity: 0; transform: translate(-50%, -85px) scale(1.15); }
    }

    /* Всплывающее уведомление */
    #toast {
      position: fixed;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: #059669;
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      z-index: 999;
      display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

<div class="app">
  <div id="toast"></div>

  <div class="header">
    <div class="top-bar">
      <div class="top-btn" id="btn-friends">👥 Друзья</div>
      <div class="rank-pill" id="rank">Ур. 1 • Новичок</div>
      <div class="top-btn save" id="btn-save">💾 В бот</div>
    </div>
    <div id="balance">$0</div>
    <div class="stats">
      <div class="stat-chip">За клик: <b id="per-tap">+$1</b></div>
      <div class="stat-chip">Пассивно: <b id="per-sec">+$0/сек</b></div>
    </div>
  </div>

  <div class="center-zone">
    <div id="turbo-tag">🔥 ТУРБО x2 (<span id="turbo-sec">20</span>с)</div>
    <div id="coin-btn">💎</div>
    <div class="energy-wrap">
      <div class="energy-top">
        <span>⚡ Энергия</span>
        <span id="energy-text">500 / 500</span>
      </div>
      <div class="energy-bar"><div id="energy-fill"></div></div>
    </div>
  </div>

  <div class="shop">
    <div class="tabs">
      <div class="tab active" data-tab="biz">🏢 Бизнесы</div>
      <div class="tab" data-tab="tap">⚡ Прокачка</div>
      <div class="tab" data-tab="bonus">🎁 Бонусы</div>
    </div>
    <div class="list" id="shop-list"></div>
  </div>
</div>

<script>
  const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
  if (tg && tg.expand) tg.expand();

  const BUSINESSES = [
    { name: "Кофейный островок", icon: "☕", baseCost: 15, income: 1 },
    { name: "Автомойка 24/7", icon: "🚗", baseCost: 120, income: 6 },
    { name: "Майнинг-ферма", icon: "🖥️", baseCost: 750, income: 30 },
    { name: "Сеть ресторанов", icon: "🍔", baseCost: 3800, income: 135 },
    { name: "IT-Корпорация", icon: "🚀", baseCost: 18000, income: 620 },
    { name: "Космодром", icon: "🛸", baseCost: 95000, income: 3100 }
  ];

  const UPGRADES = [
    { name: "Сила клика", icon: "👆", baseCost: 30, addTap: 1, addEnergy: 0 },
    { name: "Запас энергии", icon: "🔋", baseCost: 80, addTap: 0, addEnergy: 250 },
    { name: "Алмазный палец", icon: "💠", baseCost: 400, addTap: 5, addEnergy: 100 },
    { name: "Турбо-генератор", icon: "⚡", baseCost: 1500, addTap: 15, addEnergy: 500 }
  ];

  let state = {
    balance: 0,
    totalEarned: 0,
    tapPower: 1,
    energy: 500,
    maxEnergy: 500,
    bizLevels:,
    upgLevels:,
    lastSaveTime: Date.now(),
    lastDailyTime: 0,
    lastFreeEnergyTime: 0
  };

  try {
    const raw = localStorage.getItem('tycoon_v4');
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed.balance === 'number') {
        state = Object.assign(state, parsed);
      }
    }
  } catch (e) {}

  let currentTab = 'biz';
  let turboEnd = 0;

  function showToast(msg, isError) {
    const el = document.getElementById('toast');
    el.innerText = msg;
    el.style.background = isError ? '#dc2626' : '#059669';
    el.style.display = 'block';
    clearTimeout(el._t);
    el._t = setTimeout(() => { el.style.display = 'none'; }, 1800);
  }
