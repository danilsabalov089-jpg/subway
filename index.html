<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Subway Runner 3D</title>
  <script src="https://telegram.org"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #1a103c; font-family: 'Segoe UI', Roboto, sans-serif;
      touch-action: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: fixed; top: 14px; left: 16px; right: 16px;
      display: flex; justify-content: space-between; align-items: center;
      color: #fff; font-weight: 800; font-size: 16px; pointer-events: none;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6); z-index: 5;
    }
    .badge {
      background: rgba(15, 23, 42, 0.7); padding: 7px 12px;
      border-radius: 12px; border: 1px solid rgba(255,255,255,0.2);
    }
    .coin-txt { color: #facc15; }
    #overlay {
      position: fixed; inset: 0;
      background: rgba(12, 10, 32, 0.85);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #fff; text-align: center; padding: 24px; z-index: 10;
    }
    #overlay h1 {
      font-size: 32px; margin-bottom: 10px;
      background: linear-gradient(90deg, #38bdf8, #facc15, #f43f5e);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    #overlay p { font-size: 15px; color: #cbd5e1; margin-bottom: 24px; line-height: 1.5; max-width: 300px; }
    #btn-start {
      padding: 15px 40px; font-size: 20px; font-weight: 800; color: #0f172a;
      background: linear-gradient(90deg, #facc15, #fb923c);
      border: none; border-radius: 16px; cursor: pointer;
    }
    #btn-back {
      margin-top: 14px; padding: 10px 24px; font-size: 15px; font-weight: 700;
      color: #fff; background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25); border-radius: 12px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div class="badge" id="score-box">🏃 0 м</div>
    <div class="badge coin-txt" id="coin-box">🪙 0</div>
    <div class="badge" id="best-box">🏆 0</div>
  </div>

  <div id="overlay">
    <h1 id="ov-title">SUBWAY RUNNER</h1>
    <p id="ov-desc">Свайпай <b>влево / вправо</b> для смены пути,<br><b>вверх</b> — прыжок, <b>вниз</b> — подкат!</p>
    <button id="btn-start">▶ БЕЖАТЬ</button>
    <button id="btn-back" onclick="history.back()">🔙 В каталог игр</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const ovTitle = document.getElementById('ov-title');
    const ovDesc = document.getElementById('ov-desc');
    const btnStart = document.getElementById('btn-start');
    const scoreBox = document.getElementById('score-box');
    const coinBox = document.getElementById('coin-box');
    const bestBox = document.getElementById('best-box');

    let W, H, horizonY, groundY;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      horizonY = H * 0.28;
      groundY = H * 0.88;
    }
    window.addEventListener('resize', resize);
    resize();

    let best = Number(localStorage.getItem('sub_runner_best') || 0);
    bestBox.textContent = '🏆 ' + best;

    let running = false, distance = 0, coins = 0, speed = 0.011, frame = 0;
    const player = { lane: 0, visualLane: 0, y: 0, vy: 0, jumping: false, rolling: false, rollTimer: 0 };
    let items = [];

    function startGame() {
      distance = 0; coins = 0; speed = 0.011; frame = 0;
      player.lane = 0; player.visualLane = 0; player.y = 0; player.vy = 0;
      player.jumping = false; player.rolling = false; items = [];
      scoreBox.textContent = '🏃 0 м';
      coinBox.textContent = '🪙 0';
      running = true;
      overlay.style.display = 'none';
    }
    btnStart.addEventListener('click', startGame);

    function moveLeft() { if (running && player.lane > -1) player.lane--; }
    function moveRight() { if (running && player.lane < 1) player.lane++; }
    function jump() {
      if (!running || player.jumping) return;
      player.jumping = true; player.rolling = false; player.vy = 0.042;
    }
    function roll() {
      if (!running) return;
      if (player.jumping) player.vy = -0.055;
      player.rolling = true; player.rollTimer = 34;
    }

    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].clientX;
      touchStartY = e.changedTouches[0].clientY;
    }, { passive: true });
    window.addEventListener('touchend', (e) => {
      if (!running) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) dx > 0 ? moveRight() : moveLeft();
      else dy < 0 ? jump() : roll();
    }, { passive: true });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') moveLeft();
      if (e.code === 'ArrowRight' || e.code === 'KeyD') moveRight();
      if (e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Space') jump();
      if (e.code === 'ArrowDown' || e.code === 'KeyS') roll();
    });

    function project(lane, z, yOffset = 0) {
      const scale = 0.14 + Math.pow(z, 1.55) * 0.86;
      const y = horizonY + (groundY - horizonY) * Math.pow(z, 1.45) - yOffset * scale * H * 0.45;
      const laneSpread = W * 0.29 * scale;
      return { x: W / 2 + lane * laneSpread, y, scale };
    }

    function spawnRow() {
      const lanes = [-1, 0, 1];
      const safeLane = lanes[Math.floor(Math.random() * 3)];
      lanes.forEach((l) => {
        if (l === safeLane) {
          if (Math.random() < 0.75) {
            for (let c = 0; c < 3; c++) items.push({ kind: 'coin', lane: l, z: -c * 0.045 });
          }
          return;
        }
        const r = Math.random();
        if (r < 0.42) items.push({ kind: 'train', lane: l, z: 0 });
        else if (r < 0.72) items.push({ kind: 'low', lane: l, z: 0 });
        else if (r < 0.9) items.push({ kind: 'high', lane: l, z: 0 });
      });
    }

    function gameOver() {
      running = false;
      const finalScore = Math.floor(distance);
      if (finalScore > best) {
        best = finalScore;
        localStorage.setItem('sub_runner_best', best);
        bestBox.textContent = '🏆 ' + best;
      }
      ovTitle.textContent = 'СТОЛКНОВЕНИЕ!';
      ovDesc.innerHTML = 'Дистанция: <b>' + finalScore + ' м</b> | Монет: <b>' + coins + '</b><br>Рекорд: <b>' + best + ' м</b>';
      btnStart.textContent = '↻ ЕЩЁ РАЗ';
      overlay.style.display = 'flex';
    }

    function update() {
      if (!running) return;
      frame++;
      distance += speed * 28;
      speed = Math.min(0.024, speed + 0.0000035);
      scoreBox.textContent = '🏃 ' + Math.floor(distance) + ' м';
      player.visualLane += (player.lane - player.visualLane) * 0.24;

      if (player.jumping) {
        player.y += player.vy;
        player.vy -= 0.0024;
        if (player.y <= 0) { player.y = 0; player.vy = 0; player.jumping = false; }
      }
      if (player.rolling) {
        player.rollTimer--;
        if (player.rollTimer <= 0) player.rolling = false;
      }
      if (frame % Math.max(36, Math.floor(68 - speed * 1400)) === 0) spawnRow();

      for (let i = items.length - 1; i >= 0; i--) {
        const it = items[i];
        it.z += speed;
        if (it.z >= 0.87 && it.z <= 0.95 && Math.abs(it.lane - player.visualLane) < 0.42) {
          if (it.kind === 'coin') { coins++; coinBox.textContent = '🪙 ' + coins; items.splice(i, 1); continue; }
          if (it.kind === 'train' && player.y < 0.28) { gameOver(); return; }
          if (it.kind === 'low' && player.y < 0.16) { gameOver(); return; }
          if (it.kind === 'high' && !player.rolling) { gameOver(); return; }
        }
        if (it.z > 1.12) items.splice(i, 1);
      }
    }

    function draw() {
      const sky = ctx.createLinearGradient(0, 0, 0, horizonY);
      sky.addColorStop(0, '#0f172a'); sky.addColorStop(1, '#312e81');
      ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizonY);

      ctx.fillStyle = '#1e1b4b';
      for (let i = 0; i < 12; i++) {
        const bw = W / 10, bh = 25 + ((i * 37) % 45);
        ctx.fillRect(i * bw - 10, horizonY - bh, bw - 4, bh);
      }

      const groundGrad = ctx.createLinearGradient(0, horizonY, 0, H);
      groundGrad.addColorStop(0, '#1e293b'); groundGrad.addColorStop(1, '#0f172a');
      ctx.fillStyle = groundGrad; ctx.fillRect(0, horizonY, W, H - horizonY);

      [-1, 0, 1].forEach((lane) => {
        const top = project(lane, 0), bot = project(lane, 1.05);
        const railOffsetTop = W * 0.045 * top.scale, railOffsetBot = W * 0.045 * bot.scale;
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
        for (let step = 0; step < 14; step++) {
          const z = ((step / 14) + (distance * 0.015) % (1 / 14));
          const p = project(lane, z), rw = W * 0.06 * p.scale;
          ctx.lineWidth = Math.max(1, 3 * p.scale);
          ctx.beginPath(); ctx.moveTo(p.x - rw, p.y); ctx.lineTo(p.x + rw, p.y); ctx.stroke();
        }
        ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(top.x - railOffsetTop, top.y); ctx.lineTo(bot.x - railOffsetBot, bot.y);
        ctx.moveTo(top.x + railOffsetTop, top.y); ctx.lineTo(bot.x + railOffsetBot, bot.y);
        ctx.stroke();
      });
