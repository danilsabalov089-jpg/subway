<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GTA SA 3D Lite</title>
  <script src="https://telegram.org"></script>
  <script src="https://cloudflare.com"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { overflow: hidden; background: #87CEEB; font-family: 'Arial', sans-serif; }
    
    #hud {
      position: absolute; top: 12px; right: 15px; text-align: right;
      font-family: 'Impact', 'Arial Black', sans-serif;
      text-shadow: 2px 2px 0 #000, -1px -1px 0 #000;
      pointer-events: none; z-index: 10;
    }
    #money { color: #2e8b57; font-size: 24px; letter-spacing: 1px; }
    #wanted { color: #ffd700; font-size: 18px; margin-top: 2px; }
    #hp-bar {
      width: 110px; height: 10px; background: #400; border: 2px solid #000;
      margin-left: auto; margin-top: 5px;
    }
    #hp-fill { width: 100%; height: 100%; background: #b22222; }

    #save-btn {
      position: absolute; top: 15px; left: 15px; z-index: 10;
      background: rgba(0, 0, 0, 0.7); color: #fff; border: 1px solid #2e8b57;
      padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: bold;
    }

    #stick-zone {
      position: absolute; bottom: 25px; left: 25px; width: 120px; height: 120px;
      background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%; z-index: 10; touch-action: none;
    }
    #stick-knob {
      position: absolute; top: 35px; left: 35px; width: 46px; height: 46px;
      background: rgba(255, 255, 255, 0.6); border-radius: 50%; pointer-events: none;
    }

    #actions {
      position: absolute; bottom: 25px; right: 25px; z-index: 10;
      display: grid; grid-template-columns: repeat(2, 62px); gap: 12px;
    }
    .act-btn {
      width: 62px; height: 62px; border-radius: 50%;
      background: rgba(0, 0, 0, 0.45); border: 2px solid rgba(255, 255, 255, 0.6);
      color: #fff; font-size: 22px; display: flex; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .act-btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.95); }
    #btn-car { border-color: #ffa500; }
    #btn-shoot { border-color: #ff4444; }
  </style>
</head>
<body>

  <button id="save-btn">💾 Сохранить в бот</button>

  <div id="hud">
    <div id="money">$00000250</div>
    <div id="hp-bar"><div id="hp-fill"></div></div>
    <div id="wanted">☆☆☆☆☆</div>
  </div>

  <div id="stick-zone"><div id="stick-knob"></div></div>

  <div id="actions">
    <div class="act-btn" id="btn-car">🚗</div>
    <div class="act-btn" id="btn-shoot">🔫</div>
    <div class="act-btn" id="btn-sprint">🏃</div>
    <div class="act-btn" id="btn-brake">🛑</div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.Fog(0x87CEEB, 40, 140);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    document.body.appendChild(renderer.domElement);

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xfff0dd, 0.8);
    dirLight.position.set(50, 80, 30);
    scene.add(dirLight);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(300, 300),
      new THREE.MeshLambertMaterial({ color: 0x3a5f27 })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const roadMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
    const road1 = new THREE.Mesh(new THREE.PlaneGeometry(16, 260), roadMat);
    road1.rotation.x = -Math.PI / 2; road1.position.y = 0.02;
    scene.add(road1);

    const road2 = new THREE.Mesh(new THREE.PlaneGeometry(260, 16), roadMat);
    road2.rotation.x = -Math.PI / 2; road2.position.y = 0.02;
    scene.add(road2);

    const culDeSac = new THREE.Mesh(new THREE.CircleGeometry(18, 24), roadMat);
    culDeSac.rotation.x = -Math.PI / 2; culDeSac.position.set(0, 0.03, -40);
    scene.add(culDeSac);

    function createHouse(x, z, color) {
      const h = 6 + Math.random() * 6;
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(12, h, 12),
        new THREE.MeshLambertMaterial({ color })
      );
      mesh.position.set(x, h / 2, z);
      scene.add(mesh);
    }

    const colors = [0xd2b48c, 0x8fbc8f, 0xbc8f8f, 0xdeb887];
    for (let i = -100; i <= 100; i += 28) {
      if (Math.abs(i) > 15) {
        createHouse(-20, i, colors[Math.abs(i) % colors.length]);
        createHouse(20, i, colors[(Math.abs(i) + 1) % colors.length]);
        createHouse(i, -20, colors[(Math.abs(i) + 2) % colors.length]);
        createHouse(i, 20, colors[(Math.abs(i) + 3) % colors.length]);
      }
    }

    const cj = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.3, 0.5), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    body.position.y = 1.35;
    const legs = new THREE.Mesh(new THREE.BoxGeometry(0.85, 0.9, 0.45), new THREE.MeshLambertMaterial({ color: 0x1e3f66 }));
    legs.position.y = 0.45;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.55, 0.55), new THREE.MeshLambertMaterial({ color: 0x5c3a21 }));
    head.position.y = 2.3;
    cj.add(body, legs, head);
    cj.position.set(0, 0, -35);
    scene.add(cj);

    const car = new THREE.Group();
    const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.1, 4.8), new THREE.MeshLambertMaterial({ color: 0x2e8b57 }));
    carBody.position.y = 0.8;
    const carCabin = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.8, 2.4), new THREE.MeshLambertMaterial({ color: 0x111111 }));
    carCabin.position.set(0, 1.6, -0.2);
    car.add(carBody, carCabin);
    car.position.set(6, 0, -32);
    scene.add(car);

    const pickups = [];
    for (let i = 0; i < 15; i++) {
      const p = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.4, 0.8), new THREE.MeshBasicMaterial({ color: 0x00ff00 }));
      p.position.set((Math.random() - 0.5) * 160, 0.6, (Math.random() - 0.5) * 160);
      scene.add(p);
      pickups.push(p);
    }

    let money = 250;
    let wanted = 0;
    let inCar = false;
    let carSpeed = 0;
    let isSprinting = false;
    let isBraking = false;
    const bullets = [];

    let joyX = 0, joyY = 0;
    const stickZone = document.getElementById('stick-zone');
    const stickKnob = document.getElementById('stick-knob');

    stickZone.addEventListener('touchmove', (e) => {
      e.preventDefault();
      const rect = stickZone.getBoundingClientRect();
      const touch = e.touches[0];
      let dx = touch.clientX - (rect.left + 60);
      let dy = touch.clientY - (rect.top + 60);
      const dist = Math.min(Math.hypot(dx, dy), 40);
      const angle = Math.atan2(dy, dx);
      joyX = (Math.cos(angle) * dist) / 40;
      joyY = (Math.sin(angle) * dist) / 40;
      stickKnob.style.transform = `translate(${joyX * 35}px, ${joyY * 35}px)`;
    });

    stickZone.addEventListener('touchend', () => {
      joyX = 0; joyY = 0;
      stickKnob.style.transform = `translate(0px, 0px)`;
    });

    document.getElementById('btn-car').addEventListener('touchstart', (e) => {
      e.preventDefault();
      if (inCar) {
        inCar = false;
        cj.visible = true;
        cj.position.set(car.position.x - 2.5, 0, car.position.z);
        carSpeed = 0;
      } else if (cj.position.distanceTo(car.position) < 5) {
        inCar = true;
        cj.visible = false;
        updateHUD();
      }
    });

    document.getElementById('btn-shoot').addEventListener('touchstart', (e) => {
      e.preventDefault();
      const actor = inCar ? car : cj;
      const b = new THREE.Mesh(new THREE.SphereGeometry(0.2), new THREE.MeshBasicMaterial({ color: 0xffff00 }));
      b.position.copy(actor.position);
      b.position.y = 1.4;
      b.rotation.y = actor.rotation.y;
      scene.add(b);
      bullets.push({ mesh: b, life: 40 });
      
      if (wanted < 5 && Math.random() < 0.25) {
        wanted++;
        updateHUD();
      }
    });

    const btnSprint = document.getElementById('btn-sprint');
    btnSprint.addEventListener('touchstart', (e) => { e.preventDefault(); isSprinting = true; });
    btnSprint.addEventListener('touchend', () => isSprinting = false);

    const btnBrake = document.getElementById('btn-brake');
    btnBrake.addEventListener('touchstart', (e) => { e.preventDefault(); isBraking = true; });
    btnBrake.addEventListener('touchend', () => isBraking = false);

    document.getElementById('save-btn').addEventListener('click', () => {
      tg.sendData(JSON.stringify({ action: 'save_gta', money: money, wanted: wanted }));
    });

    function updateHUD() {
      document.getElementById('money').innerText = '$' + String(money).padStart(8, '0');
      document.getElementById('wanted').innerText = '★'.repeat(wanted) + '☆'.repeat(5 - wanted);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (inCar) {
        if (joyY < -0.1) carSpeed = Math.min(carSpeed + 0.025, 0.85);
        else if (joyY > 0.1) carSpeed = Math.max(carSpeed - 0.025, -0.35);
        else carSpeed *= 0.96;

        if (isBraking) carSpeed *= 0.85;

        if (Math.abs(carSpeed) > 0.03) {
          car.rotation.y -= joyX * 0.045 * Math.sign(carSpeed);
        }
        car.position.x -= Math.sin(car.rotation.y) * carSpeed;
        car.position.z -= Math.cos(car.rotation.y) * carSpeed;
        cj.position.copy(car.position);
      } else {
